<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator CNC</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    background: #ffffff;
    color: black;
    border-radius: 15px;
    padding: 20px;
    max-width: 400px;
    margin: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
    margin-bottom: 10px;
    color: #2a5298;
}

input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #2a5298;
    color: white;
    border: none;
    padding: 12px;
    width: 95%;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1e3c72;
}

.result {
    margin-top: 15px;
    padding: 10px;
    background: #f0f8ff;
    border-radius: 10px;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.8;
}
</style>

</head>
<body>

<h2>🔧 Smart CNC Calculator</h2>

<div class="container">
    <h1>Kalkulator CNC</h1>

    <input type="number" id="diameter" placeholder="Diameter Tool (mm)">
    <input type="number" id="vc" placeholder="Cutting Speed Vc (m/min)">
    <input type="number" id="fz" placeholder="Feed per Tooth fz (mm)">
    <input type="number" id="z" placeholder="Jumlah Mata Pahat (z)">

    <button onclick="hitung()">Hitung</button>

    <div class="result">
        <p>Spindle Speed: <b id="spindle">-</b> rpm</p>
        <p>Feed Rate: <b id="feed">-</b> mm/min</p>
    </div>
</div>

<div class="footer">
    Smart Laboratory CNC System
</div>

<script>
function hitung() {
    let D = parseFloat(document.getElementById("diameter").value);
    let Vc = parseFloat(document.getElementById("vc").value);
    let fz = parseFloat(document.getElementById("fz").value);
    let z = parseFloat(document.getElementById("z").value);

    if (!D || !Vc || !fz || !z) {
        alert("Isi semua data terlebih dahulu!");
        return;
    }

    let n = (1000 * Vc) / (Math.PI * D);
    let F = fz * z * n;

    document.getElementById("spindle").innerText = n.toFixed(0);
    document.getElementById("feed").innerText = F.toFixed(0);
}
</script>

</body>
</html>
